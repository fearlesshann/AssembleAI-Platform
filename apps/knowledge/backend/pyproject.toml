[project]
name = "assembleai-knowledge-backend"
version = "0.1.0"
description = "Private document indexing and independently authorized knowledge answers"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi==0.140.0",
  "uvicorn==0.51.0",
  "pypdf==6.21.4",
  "httpx==0.28.1",
  "onnxruntime==1.31.1",
  "tokenizers==0.23.3",
  "numpy==2.5.4",
]

[dependency-groups]
dev = ["pytest==8.4.2"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["../../../tests/backend/test_knowledge_documents.py", "../../../tests/python"]
python_files = ["test_knowledge*.py"]
pythonpath = ["."]
addopts = "-ra"
