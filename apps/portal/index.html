<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>集智 · UI 样例</title>
  <base href="/" />
  <link rel="icon" href="favicon.ico?v=20261102t" sizes="any" />
  <link rel="icon" type="image/png" href="favicon.png?v=20261102t" sizes="32x32" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png?v=20261102t" />
  <script>
    (function () {
      try {
        var KEY = "mfg-ai-theme";
        var saved = localStorage.getItem(KEY);
        var theme = (saved === "light" || saved === "dark")
          ? saved
          : (window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
        document.documentElement.setAttribute("data-theme", theme);
      } catch (e) {
        document.documentElement.setAttribute("data-theme", "dark");
      }
      try {
        var authed = localStorage.getItem("mfg-ai-auth") === "1" || sessionStorage.getItem("mfg-ai-auth-session") === "1";
        document.documentElement.setAttribute("data-auth", authed ? "in" : "out");
      } catch (e) {
        document.documentElement.setAttribute("data-auth", "out");
      }
    })();
  </script>
</head>
<body>
  <div id="portal-root" style="display: contents"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
