<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>集智 · 应用中心</title>
  <base href="/" />
  <link rel="icon" href="favicon.ico?v=20261102t" sizes="any" />
  <link rel="icon" type="image/png" href="favicon.png?v=20261102t" sizes="32x32" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png?v=20261102t" />
  <script>
    (function () {
      try {
        var reference = location.pathname.indexOf('/reference-ui/') === 0;
        var KEY = reference ? "mfg-ai-theme" : "assembleai.theme";
        var saved = localStorage.getItem(KEY);
        var theme = saved === "dark" ? "dark" : "light";
        document.documentElement.setAttribute("data-theme", theme);
      } catch (e) {
        document.documentElement.setAttribute("data-theme", "light");
      }
      if (location.pathname.indexOf('/reference-ui/') === 0) {
        try {
          var authed = localStorage.getItem("mfg-ai-auth") === "1" || sessionStorage.getItem("mfg-ai-auth-session") === "1";
          document.documentElement.setAttribute("data-auth", authed ? "in" : "out");
        } catch (e) {
          document.documentElement.setAttribute("data-auth", "out");
        }
      }
    })();
  </script>
</head>
<body>
  <div id="portal-root" style="display: contents"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
