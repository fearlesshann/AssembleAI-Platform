[project]
name = "assembleai-chatbi-backend"
version = "0.1.0"
description = "Platform-authorized ChatBI query planning and data analysis backend"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi==0.140.0",
  "httpx==0.28.1",
  "uvicorn==0.51.0",
]

[dependency-groups]
dev = [
  "pytest==8.4.2",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["../../../tests/backend"]
python_files = ["test_chatbi*.py"]
pythonpath = ["."]
addopts = "-ra"
